<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PukiNotes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20128%20128%22%3E%3Crect%20x%3D%224%22%20y%3D%224%22%20width%3D%22120%22%20height%3D%22120%22%20rx%3D%2230%22%20fill%3D%22%23d4694a%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M64%2024%20L100%2054%20V98%20a6%206%200%200%201-6%206%20H46%20L28%2086%20V54%20Z%22%20fill%3D%22%23fffaf3%22%20stroke%3D%22%23fffaf3%22%20stroke-width%3D%226%22%20stroke-linejoin%3D%22round%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M28%2086%20L46%2086%20a0%200%200%200%201%200%200%20V104%20Z%22%20fill%3D%22%23f0dcc6%22%20stroke%3D%22%23f0dcc6%22%20stroke-width%3D%226%22%20stroke-linejoin%3D%22round%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M64%2088%20C50%2078%2046%2071%2046%2065%20a8.5%208.5%200%200%201%2018-4%20a8.5%208.5%200%200%201%2018%204%20C82%2071%2078%2078%2064%2088%20Z%22%20fill%3D%22%23d4694a%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Kalam:wght@400&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f0e6; --dot:#dccdb9; --ink:#3b2f2a; --muted:#8c7b6e; --faint:#b9a898;
  --panel:#fffaf3; --line:#eadfce;
  --accent:#d4694a; --accent-2:#bf5a3d; --accent-soft:#f7ddd0;
  --sage:#7a9a6b; --sage-soft:#e2ebd8;
  --shadow:0 10px 30px rgba(92,58,32,.13), 0 2px 6px rgba(92,58,32,.08);
  --shadow-sm:0 3px 10px rgba(92,58,32,.10), 0 1px 2px rgba(92,58,32,.08);
  --r:16px; --ease:cubic-bezier(.2,.9,.25,1.15);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:Nunito,ui-rounded,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.ui{position:fixed;z-index:20}

/* ---------- canvas ---------- */
#viewport{position:fixed;inset:0;overflow:hidden;touch-action:none;
  background-color:var(--paper);
  background-image:radial-gradient(circle, var(--dot) 1.2px, transparent 1.4px);
  background-size:24px 24px}
#viewport.t-select{cursor:default}
#viewport.t-hand,#viewport.space{cursor:grab}
#viewport.panning{cursor:grabbing}
#viewport.t-pen,#viewport.t-line{cursor:crosshair}
#viewport.t-sticky,#viewport.t-comment{cursor:copy}
#viewport.t-eraser{cursor:cell}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#world.glide{transition:transform .18s ease-out}
#items,#pins{position:absolute;left:0;top:0}
svg#ink{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#ink .hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;stroke-linecap:round;stroke-linejoin:round}
#ink .vis{fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
#ink g.selected .hit{stroke:rgba(212,105,74,.18)}
#viewport.t-select #ink .hit{cursor:move}
#ink .live.snap{animation:snap .28s var(--ease)}
@keyframes snap{0%{stroke-width:var(--w)}40%{stroke-width:calc(var(--w) + 4px);opacity:.75}100%{stroke-width:var(--w)}}

.item{position:absolute;user-select:none}
.pop{animation:pop .22s var(--ease)}
@keyframes pop{from{transform:scale(.85) rotate(var(--rot,0deg));opacity:0}to{transform:scale(1) rotate(var(--rot,0deg));opacity:1}}

/* sticky */
.sticky{min-height:150px;padding:16px 16px 34px;border-radius:4px 4px 14px 4px;
  transform:rotate(var(--rot,0deg));box-shadow:0 1px 1px rgba(0,0,0,.04),0 8px 18px -6px rgba(92,58,32,.28);
  transition:box-shadow .15s, transform .15s var(--ease)}
.sticky:hover{box-shadow:0 1px 1px rgba(0,0,0,.04),0 14px 26px -8px rgba(92,58,32,.32)}
.sticky .txt{font-family:Kalam,cursive;font-size:20px;line-height:1.3;white-space:pre-wrap;word-break:break-word;outline:none;min-height:1.3em;color:#3a2e26}
.sticky .txt[contenteditable=true]{cursor:text;user-select:text}
.sticky .txt:empty::before{content:"Write something…";color:rgba(58,46,38,.35)}
.sticky .who{position:absolute;left:12px;bottom:10px;width:18px;height:18px;border-radius:50%;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center}
.sticky::after{content:"";position:absolute;right:0;bottom:0;width:22px;height:22px;
  background:linear-gradient(135deg, rgba(0,0,0,.07) 50%, transparent 50%);border-radius:0 0 14px 0}

/* image (polaroid) */
.image{background:#fff;padding:8px 8px 26px;border-radius:6px;box-shadow:var(--shadow-sm)}
.image img{display:block;width:100%;height:auto;border-radius:3px;pointer-events:none}

.item.selected{outline:2px solid var(--accent);outline-offset:4px}
.handle{position:absolute;right:-9px;bottom:-9px;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--accent);cursor:nwse-resize;display:none;box-shadow:var(--shadow-sm)}
.item.selected .handle{display:block}

/* comments */
.pinwrap{position:absolute}
.pin{width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:translate(0,-100%);display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:13px;box-shadow:var(--shadow-sm);border:2px solid #fff;transition:transform .15s var(--ease)}
.pin:hover{transform:translate(0,-100%) scale(1.08)}
.pin .count{position:absolute;right:-6px;top:-6px;background:var(--ink);color:#fff;border-radius:10px;font-size:10px;padding:1px 5px;border:2px solid var(--paper)}
.pinwrap.selected .pin{outline:2px solid var(--accent);outline-offset:2px}
.card{position:absolute;left:44px;top:-40px;width:260px;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);
  padding:12px;cursor:auto;animation:pop .18s var(--ease);transform-origin:0 0}
.msg{display:flex;gap:8px;margin-bottom:10px;font-size:14px;line-height:1.35}
.msg .av{flex:none;width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.msg b{font-weight:800;margin-right:4px}
.msg .t{color:var(--faint);font-size:11px}
.card input{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font:inherit;font-size:14px;outline:none;color:var(--ink)}
.card input:focus{border-color:var(--accent)}

/* partner cursor */
#partner{position:fixed;left:0;top:0;z-index:15;pointer-events:none;transition:opacity .3s}
#partner .tag{position:absolute;left:14px;top:16px;background:var(--sage);color:#fff;font-size:12px;font-weight:800;padding:2px 8px;border-radius:8px 8px 8px 2px;white-space:nowrap}

/* ---------- chrome ---------- */
.pill{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow)}
#top-left{left:16px;top:16px;display:flex;align-items:center;gap:6px;padding:6px 8px 6px 6px}
.brand{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:11px}
.brand:hover,.iconbtn:hover{background:#f3e8da}
.logo{width:28px;height:28px;display:grid;place-items:center}
.brand .name{font-family:Fraunces,serif;font-weight:650;font-size:17px;letter-spacing:-.01em}
.sep{width:1px;height:22px;background:var(--line)}
#boardName{font-weight:700;padding:6px 8px;border-radius:9px;outline:none;min-width:40px}
#boardName[contenteditable=true]{background:#fff;box-shadow:inset 0 0 0 1.5px var(--accent)}
.saved{font-size:12px;color:var(--muted);padding-right:6px;display:flex;align-items:center;gap:5px}
.saved i{width:7px;height:7px;border-radius:50%;background:var(--sage);display:inline-block}

#top-right{right:16px;top:16px;display:flex;align-items:center;gap:10px;padding:6px}
.faces{display:flex;padding-left:4px}
.face{width:32px;height:32px;border-radius:50%;color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;border:2px solid var(--panel);margin-left:-6px;position:relative}
.face.online::after{content:"";position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:#5fb36b;border:2px solid var(--panel)}
.conn{font-size:12.5px;color:var(--muted);line-height:1.2}
.conn b{color:var(--ink);display:block;font-size:13px}
.share{background:var(--accent);color:#fff;font-weight:800;padding:9px 11px;border-radius:12px;display:flex;gap:7px;align-items:center;transition:transform .12s var(--ease),background .12s}
.share:hover{background:var(--accent-2)}
.share:active{transform:scale(.96)}

#toolbar{left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:4px;padding:7px}
.tool{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;position:relative;color:#6b5a4e;transition:background .12s, transform .12s var(--ease), color .12s}
.tool:hover{background:#f3e8da;color:var(--ink)}
.tool:active{transform:scale(.92)}
.tool.on{background:var(--accent-soft);color:var(--accent-2)}
.tool svg{width:22px;height:22px}
.tool .k{display:none}
.tool.on .k{color:var(--accent)}
.tsep{width:1px;margin:8px 3px;background:var(--line)}
.tip{position:absolute;bottom:58px;left:50%;transform:translateX(-50%) translateY(4px);background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:.12s}
.tool:hover .tip{opacity:1;transform:translateX(-50%)}

#stylebar{left:50%;bottom:86px;transform:translateX(-50%) translateY(8px);display:flex;gap:6px;align-items:center;padding:7px 10px;opacity:0;pointer-events:none;transition:.16s var(--ease)}
#stylebar.show{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);transition:transform .12s var(--ease)}
.sw:hover{transform:scale(1.12)}
.sw.on{box-shadow:0 0 0 2.5px var(--accent)}
.wd{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.wd.on{background:var(--accent-soft)}
.wd span{background:var(--ink);border-radius:9px;width:16px}
.assist{font-size:12px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center;padding:4px 8px;border-radius:9px}
.assist.on{color:var(--sage);background:var(--sage-soft)}

#zoom{right:16px;bottom:18px;display:flex;align-items:center;padding:5px;gap:2px}
.iconbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#6b5a4e}
#zoomLabel{min-width:52px;text-align:center;font-size:13px;font-weight:800;padding:8px 4px;border-radius:10px}
#zoomLabel:hover{background:#f3e8da}

#hint{left:16px;bottom:18px;max-width:300px;font-size:13px;color:var(--muted);padding:10px 14px;display:flex;gap:10px;align-items:center}
#hint b{color:var(--ink)}
#hint .x{color:var(--faint);font-weight:800;padding:0 2px}

#toast{left:50%;top:76px;transform:translateX(-50%) translateY(-8px);background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:9px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s var(--ease);box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translateX(-50%)}

/* drawer */
#drawer{left:16px;top:76px;width:260px;padding:10px;transform:translateY(-6px) scale(.98);transform-origin:top left;opacity:0;pointer-events:none;transition:.16s var(--ease)}
#drawer.show{opacity:1;pointer-events:auto;transform:none}
#updRow{margin:8px 2px 2px;padding:10px;border-radius:12px;background:var(--accent-soft);font-size:13px;line-height:1.35}
#updRow[hidden]{display:none}
#updRow b{display:block;font-size:14px}
#updRow small{display:block;color:var(--muted);margin-top:2px;word-break:break-word}
#updRow button{margin-top:8px;padding:7px 12px;border-radius:9px;background:var(--accent);color:#fff;font-weight:700}
#updRow button:disabled{opacity:.6}
#updRow .err{color:#b4442c;margin-top:6px}
#updLink[hidden]{display:none}
#updLink{display:block;margin:6px 8px 2px;font-size:12px;color:var(--muted);text-decoration:underline;cursor:pointer;background:none;padding:0}
.gear{position:relative;color:#6b5a4e}
.gear .udot{position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid #fff;display:none}
.gear.has-update .udot{display:block}


.brd{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:11px;text-align:left}
.brd:hover{background:#f3e8da}
.brd.on{background:var(--accent-soft)}
.brd .thumb{width:34px;height:26px;border-radius:6px;background:var(--paper);background-image:radial-gradient(circle,var(--dot) 1px,transparent 1.2px);background-size:6px 6px;border:1px solid var(--line);position:relative;overflow:hidden}
.brd .thumb i{position:absolute;width:10px;height:9px;border-radius:2px}
.brd small{display:block;color:var(--muted);font-size:12px}
.brd b{font-weight:700;font-size:14px}
.newb{color:var(--accent-2);font-weight:800}

/* share modal */
#scrim{position:fixed;inset:0;z-index:40;background:rgba(59,47,42,.28);display:grid;place-items:center;opacity:0;pointer-events:none;transition:.18s}
#scrim.show{opacity:1;pointer-events:auto}
.modal{width:min(440px,calc(100vw - 32px));background:var(--panel);border-radius:22px;box-shadow:0 30px 80px rgba(59,35,20,.35);padding:26px;transform:translateY(10px) scale(.97);transition:.22s var(--ease)}
#scrim.show .modal{transform:none}
.modal h2{font-family:Fraunces,serif;font-weight:650;margin:0 0 6px;font-size:24px;letter-spacing:-.01em}
.modal p{margin:0 0 18px;color:var(--muted);line-height:1.45}
.seg{display:flex;background:#f1e6d8;border-radius:12px;padding:4px;margin-bottom:16px}
.seg button{flex:1;padding:8px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}
.code{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px dashed #e2cdb7;border-radius:14px;padding:14px 14px 14px 18px;margin-bottom:16px}
.code span{flex:1;font-family:Fraunces,serif;font-size:21px;font-weight:650;letter-spacing:.01em;color:var(--accent-2)}
.copy{background:var(--ink);color:#fff;font-weight:800;font-size:13px;padding:8px 12px;border-radius:10px}
.facts{display:grid;gap:9px;margin:0;padding:0;list-style:none;font-size:14px}
.facts li{display:flex;gap:10px;align-items:flex-start}
.facts li i{flex:none;width:22px;height:22px;border-radius:7px;background:var(--sage-soft);color:var(--sage);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px}
.mfoot{display:flex;justify-content:flex-end;margin-top:20px}
.ghost{font-weight:800;padding:9px 14px;border-radius:11px;color:var(--muted)}
.ghost:hover{background:#f3e8da;color:var(--ink)}
/* table */
.table{background:#fffdf8;border-radius:12px;box-shadow:var(--shadow-sm);padding:0 0 8px;border:1px solid var(--line)}
.table .handle{display:none!important}
.tbar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:move;background:#fbf3e7;border-radius:12px 12px 0 0}
.tbar .grip{color:var(--faint);font-weight:800;letter-spacing:-2px}
.ttl{border:0;background:none;font:inherit;font-weight:800;font-size:15px;color:var(--ink);outline:none;width:190px;border-radius:6px;padding:2px 4px}
.ttl:focus{background:#fff;box-shadow:inset 0 0 0 1.5px var(--accent)}
.tmeta{margin-left:auto;font-size:12px;color:var(--muted)}
.table table{border-collapse:collapse;margin:4px 8px 0;font-size:14px}
.table th,.table td{border-bottom:1px solid #f0e6d8;padding:0}
.table th{text-align:left;padding:4px 0 2px}
.table .cl{display:block;font-size:10px;color:var(--faint);padding-left:6px;font-weight:800}
.table .rn{width:26px;text-align:center;color:var(--faint);font-size:11px;font-weight:800}
.table input.hname,.table input.cell{width:128px;box-sizing:border-box;border:0;background:none;font:inherit;color:var(--ink);padding:6px;border-radius:6px;outline:none}
.table input.hname{font-weight:800;font-size:13px;color:#6b5a4e}
.table input.cell:focus,.table input.hname:focus{background:#fff;box-shadow:inset 0 0 0 1.5px var(--accent)}
.table input.num{text-align:right;font-variant-numeric:tabular-nums}
.table input.formula{color:#5d7d50}
.table tfoot td{font-weight:800;text-align:right;padding:7px 6px;font-variant-numeric:tabular-nums;border-bottom:0;border-top:2px solid var(--line)}
.table tfoot td.rn{text-align:center}
.table{position:relative}
.table th,.table td.rn{position:relative}
.cres{position:absolute;top:2px;bottom:-1px;right:-4px;width:8px;cursor:col-resize;z-index:2}
.rres{position:absolute;left:0;right:-2px;bottom:-4px;height:8px;cursor:row-resize;z-index:2}
.tres{position:absolute;top:44px;bottom:12px;right:-5px;width:10px;cursor:ew-resize;z-index:2}
.cres::after{content:"";position:absolute;left:3px;top:4px;bottom:4px;width:2px;border-radius:2px;background:transparent;transition:background .12s}
.rres::after{content:"";position:absolute;top:3px;left:4px;right:4px;height:2px;border-radius:2px;background:transparent;transition:background .12s}
.tres::after{content:"";position:absolute;left:4px;top:30%;bottom:30%;width:3px;border-radius:3px;background:transparent;transition:background .12s}
.table:hover .cres::after,.table:hover .rres::after{background:#eadcca}
.cres:hover::after,.rres:hover::after,.tres:hover::after,.table:hover .tres::after{background:var(--accent)}
body.resizing-col,body.resizing-col *{cursor:col-resize!important;user-select:none}
body.resizing-row,body.resizing-row *{cursor:row-resize!important;user-select:none}
.table input.cell{vertical-align:middle}
.tadd{display:flex;gap:6px;padding:6px 10px 0}
.tadd button{font-size:12px;font-weight:800;color:var(--muted);padding:4px 8px;border-radius:8px}
.tadd button:hover{background:#f3e8da;color:var(--ink)}

/* agent */
.bdot{width:7px;height:7px;border-radius:50%;background:#5fb36b;display:inline-block;box-shadow:0 0 0 2px #fff}
.bind{display:flex;gap:10px;align-items:center;background:#f3ecf6;border-radius:12px;padding:9px 11px;margin-bottom:10px;font-size:13px;line-height:1.3}
.bind i{flex:none;width:9px;height:9px;border-radius:50%;background:#5fb36b;box-shadow:0 0 0 3px #dff0e0}
.bind small{display:block;color:var(--muted);font-size:11.5px}
.claudebtn{font-weight:800;font-size:16px;padding:8px 11px;border-radius:12px;color:#7d4f8a;background:#efe4f3;display:flex;gap:6px;align-items:center;transition:transform .12s var(--ease),background .12s}
.claudebtn:active{transform:scale(.96)}
.claudebtn.on{background:#a26fae;color:#fff}
#claude{right:16px;top:76px;bottom:78px;width:340px;display:flex;flex-direction:column;padding:14px;opacity:0;pointer-events:none;transform:translateX(12px);transition:.18s var(--ease)}
#claude.show{opacity:1;pointer-events:auto;transform:none}
.ch-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ch-head b{font-family:Fraunces,serif;font-size:18px;font-weight:650}
.spark{width:28px;height:28px;border-radius:9px;background:#a26fae;color:#fff;display:grid;place-items:center}
.demo{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#7d4f8a;background:#efe4f3;padding:2px 6px;border-radius:6px}
.ch-head .x{margin-left:auto;font-size:20px;color:var(--faint);width:28px;height:28px;border-radius:8px}
.ch-head .x:hover{background:#f3e8da;color:var(--ink)}
.tabs{display:flex;background:#f1e6d8;border-radius:11px;padding:3px;margin-bottom:10px}
.tabs button{flex:1;padding:6px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}
.pane{flex:1;min-height:0;display:flex;flex-direction:column}
.pane[hidden]{display:none}
#chat{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.bub{max-width:90%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.4;animation:pop .18s var(--ease)}
.bub.me{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:4px}
.bub.c{align-self:flex-start;background:#f3ecf6;border-bottom-left-radius:4px}
.bub .undo{display:inline-block;margin-top:7px;font-weight:800;font-size:12px;color:#7d4f8a;background:#fff;padding:4px 9px;border-radius:8px}
.bub .undo:disabled{color:var(--faint)}
.dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:#a26fae;animation:dot 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chips button{font-size:12.5px;font-weight:700;background:#fff;border:1.5px solid var(--line);padding:6px 10px;border-radius:20px;color:#6b5a4e}
.chips button:hover{border-color:#a26fae;color:#7d4f8a}
#askForm{display:flex;gap:6px}
#askInput{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;outline:none;background:#fff;color:var(--ink)}
#askInput:focus{border-color:#a26fae}
#askForm button{width:42px;border-radius:12px;background:#a26fae;color:#fff;font-weight:800;font-size:16px}
#histList{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
.h{display:flex;gap:10px;padding:8px;border-radius:10px;align-items:flex-start}
.h:hover{background:#f7efe4}
.h .av{flex:none;width:24px;height:24px;border-radius:50%;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.h .what{font-size:13.5px;font-weight:700;line-height:1.3}
.h .meta{font-size:12px;color:var(--muted)}
.h .p{font-size:12px;color:#7d4f8a;font-style:italic;margin-top:2px}
.h .rv{margin-left:auto;flex:none;font-size:12px;font-weight:800;color:var(--accent-2);padding:4px 9px;border-radius:8px;background:var(--accent-soft)}
.h.reverted .what{text-decoration:line-through;color:var(--muted)}
.h .done{margin-left:auto;flex:none;font-size:11px;font-weight:800;color:var(--faint)}
.fine{font-size:12px;color:var(--muted);margin:10px 2px 0;line-height:1.4}
#claudeCursor{position:fixed;left:0;top:0;z-index:16;pointer-events:none;opacity:0;transition:transform .35s cubic-bezier(.3,.8,.3,1),opacity .3s}
#claudeCursor .tag{position:absolute;left:14px;top:16px;background:#a26fae;color:#fff;font-size:12px;font-weight:800;padding:2px 8px;border-radius:8px 8px 8px 2px;white-space:nowrap}
@media (max-width:760px){ #claude{width:auto;left:16px} .conn,#hint{display:none} #toolbar{bottom:12px} .tool{width:40px;height:40px} }

/* clean UI */
.saved{padding-right:10px}
#top-right{gap:6px}
.faces .face{cursor:default}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.mhead .mi{width:22px;height:22px;color:var(--accent)}
.mhead h2{margin:0}
.modal{position:relative}
.mclose{position:absolute;top:14px;right:16px;font-size:22px;color:var(--faint);font-weight:800}
.code .copy{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent-2)}
.code .copy.ghosty{background:none;color:var(--faint)}
.code .copy.ghosty:hover{color:var(--accent-2);background:#f6ece2}
.or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px;font-weight:800;margin:4px 0 12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
#joinBtn{font-size:16px!important;padding:8px 16px!important}
.scrim2{position:fixed;inset:0;z-index:40;background:rgba(59,47,42,.28);display:grid;place-items:center;opacity:0;pointer-events:none;transition:.18s}
.scrim2.show{opacity:1;pointer-events:auto}
.scrim2 .modal{transform:translateY(10px) scale(.97);transition:.22s var(--ease)}
.scrim2.show .modal{transform:none}
.srow{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow #nameInput{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font:inherit;font-size:15px;font-weight:700;outline:none;background:#fff;color:var(--ink)}
.srow #nameInput:focus{border-color:var(--accent)}
.swatches{display:flex;gap:5px}
.swatches button{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)}
.swatches button.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.srow.net{font-size:13px;color:var(--muted)}
.srow.net i{width:9px;height:9px;border-radius:50%;background:#c9b9a6;flex:none}
.srow.net i.on{background:#5fb36b}
.srow.upd{flex-direction:column;align-items:stretch}
#updLink{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;font-weight:700;text-decoration:none;margin:0;padding:4px 0;align-self:flex-start}
#updLink svg{width:15px;height:15px}
#updLink:disabled{cursor:default;opacity:1}
#updLink:disabled svg{display:none}
#updRow{margin:0 0 6px}
#peerList{flex:1}
#peerList .peerrow{display:flex;align-items:center;gap:10px;padding:4px 0}
#peerList:empty{display:none}
.ch-head{display:flex;align-items:center;gap:10px}
.ch-head .bind{flex:1;margin:0}
.tabs button{display:grid;place-items:center}
.tabs button svg{width:17px;height:17px}
.bub.c.intro{display:none}
</style>
<style>
/* ---- additions for the real app ---- */
.face{cursor:default}
.face.me{cursor:pointer}
.face.offline{filter:grayscale(.6);opacity:.7}
.cursor{position:fixed;left:0;top:0;z-index:15;pointer-events:none;transition:transform .08s linear}
.cursor .tag{position:absolute;left:14px;top:16px;color:#fff;font-size:12px;font-weight:800;padding:2px 8px;border-radius:8px 8px 8px 2px;white-space:nowrap}
.item.editing-other{box-shadow:0 0 0 3px var(--ec),0 8px 18px -6px rgba(92,58,32,.28)!important}
.modal .field{display:flex;gap:8px;margin-bottom:14px}
.modal .field input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;outline:none;background:#fff;color:var(--ink)}
.modal .field input:focus{border-color:var(--accent)}
.modal .field button{background:var(--ink);color:#fff;font-weight:800;font-size:13px;padding:8px 14px;border-radius:10px}
.modal h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.code span{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:600;word-break:break-all;color:var(--accent-2);max-height:4.5em;overflow:hidden}
.netline{font-size:13px;color:var(--muted);margin:0 0 6px;display:flex;gap:8px;align-items:center}
.netline i{width:8px;height:8px;border-radius:50%;background:#c9b9a6;display:inline-block}
.netline i.on{background:#5fb36b}
.peerrow{display:flex;gap:10px;align-items:center;font-size:14px;padding:6px 0}
.peerrow small{color:var(--muted)}
.bind.off i{background:#c9b9a6;box-shadow:0 0 0 3px #eee4d8}
.bind code{font-size:11.5px;background:#fff;padding:1px 5px;border-radius:5px}
.bub.c .working{color:#7d4f8a;font-weight:700}
.msg .agentnote{font-size:11px;color:#7d4f8a;font-weight:700}
#connLost{left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:8px 14px;border-radius:12px;display:none}
#connLost.show{display:block}
.modal .err{color:#b0452c;font-size:13px;font-weight:700;min-height:1.2em;margin:-6px 0 10px}
</style>
</head>
<body>
<div id="viewport" class="t-select">
  <div id="world">
    <div id="items"></div>
    <svg id="ink"></svg>
    <div id="pins"></div>
  </div>
</div>
<div id="cursors"></div>

<div id="top-left" class="ui pill">
  <button class="brand" id="brandBtn" title="Your boards">
    <span class="logo"><svg width="28" height="28" viewBox="0 0 128 128" aria-hidden="true"><rect x="4" y="4" width="120" height="120" rx="30" fill="#d4694a"/>
    <path d="M64 24 L100 54 V98 a6 6 0 0 1-6 6 H46 L28 86 V54 Z" fill="#fffaf3" stroke="#fffaf3" stroke-width="6" stroke-linejoin="round"/>
    <path d="M28 86 L46 86 a0 0 0 0 1 0 0 V104 Z" fill="#f0dcc6" stroke="#f0dcc6" stroke-width="6" stroke-linejoin="round"/>
    <path d="M64 88 C50 78 46 71 46 65 a8.5 8.5 0 0 1 18-4 a8.5 8.5 0 0 1 18 4 C82 71 78 78 64 88 Z" fill="#d4694a"/></svg></span>
    <span class="name">PukiNotes</span>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8c7b6e" stroke-width="3" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <span class="sep"></span>
  <span id="boardName" title="Double-click to rename"></span>
  <span class="saved" title="Saved on this computer"><i></i><span id="savedLabel" hidden></span></span>
</div>

<div id="drawer" class="ui pill">
  <div id="boardList"></div>
  <button class="brd newb" id="newBoard" title="New board"><span class="thumb" style="display:grid;place-items:center;background:#fff">+</span>New board</button>
</div>

<div id="top-right" class="ui pill">
  <div class="faces" id="faces"></div>
  <div class="conn" id="conn" hidden></div>
  <button class="claudebtn" id="claudeBtn" title="Your agent"><span class="spark">✦</span><i class="bdot" id="agentDot"></i></button>
  <button class="share" id="shareBtn" title="Share this board"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>
  <button class="iconbtn gear" id="gearBtn" title="Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><i class="udot"></i></button>
</div>

<div id="stylebar" class="ui pill"></div>

<nav id="toolbar" class="ui pill">
  <button class="tool" data-tool="select"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3.5 19 11l-6.2 1.6L9.6 19z"/></svg><span class="k">V</span><span class="tip">Select · V</span></button>
  <button class="tool" data-tool="hand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12V5.5a1.5 1.5 0 0 1 3 0V11"/><path d="M11 10.5V4.5a1.5 1.5 0 0 1 3 0V11"/><path d="M14 10.5v-4a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-.5a6 6 0 0 1-4.6-2.2L3.6 16.6a1.6 1.6 0 0 1 2.4-2.1L8 16.5V12"/></svg><span class="k">H</span><span class="tip">Pan · H</span></button>
  <span class="tsep"></span>
  <button class="tool" data-tool="pen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 4.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/><path d="m13.5 6.5 3 3"/></svg><span class="k">P</span><span class="tip">Draw · P</span></button>
  <button class="tool" data-tool="line"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 19 5"/><path d="M10 5h9v9"/></svg><span class="k">L</span><span class="tip">Arrow · L</span></button>
  <button class="tool" data-tool="sticky"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v9l-6 6H5a1 1 0 0 1-1-1z"/><path d="M14 20v-5a1 1 0 0 1 1-1h5"/></svg><span class="k">N</span><span class="tip">Note · N</span></button>
  <button class="tool" data-tool="comment"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 12a8 8 0 1 1 3.3 6.5L4 20l1.3-3.6A8 8 0 0 1 4 12z"/></svg><span class="k">C</span><span class="tip">Comment · C</span></button>
  <button class="tool" data-tool="image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m20.5 16-5-5-9 8.5"/></svg><span class="k">I</span><span class="tip">Photo · I</span></button>
  <button class="tool" data-tool="table"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M3.5 14.5h17M9.5 9.5v10"/></svg><span class="k">T</span><span class="tip">Table · T</span></button>
  <span class="tsep"></span>
  <button class="tool" data-tool="eraser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 20-3.3-3.3a1.5 1.5 0 0 1 0-2.1L14 4.3a1.5 1.5 0 0 1 2.1 0l3.6 3.6a1.5 1.5 0 0 1 0 2.1L10 20z"/><path d="M20 20H7"/><path d="m9 9 6 6"/></svg><span class="k">E</span><span class="tip">Eraser · E</span></button>
</nav>

<div id="zoom" class="ui pill">
  <button class="iconbtn" id="zOut" title="Zoom out">−</button>
  <button id="zoomLabel" title="Reset to 100%">100%</button>
  <button class="iconbtn" id="zIn" title="Zoom in">+</button>
</div>

<div id="connLost" class="ui">Reconnecting to PukiNotes…</div>

<aside id="claude" class="ui pill" aria-label="Your agent">
  <div class="ch-head"><span class="spark">✦</span><div class="bind" id="bindCard"></div><button class="x" id="claudeX" title="Close">×</button></div>
  <div class="tabs"><button class="on" data-tab="ask" title="Ask">✦</button><button data-tab="hist" title="History: revert anything"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg></button></div>
  <div class="pane" id="askPane">
    <div id="chat"></div>
    <div class="chips"><button data-ask="Make a budget table for this month">💰 Budget</button><button data-ask="Tidy up the sticky notes">🧹 Tidy up</button><button data-ask="Summarize this board">📝 Summary</button></div>
    <form id="askForm"><input id="askInput" placeholder="Ask your agent…" autocomplete="off"><button title="Send">↑</button></form>
  </div>
  <div class="pane" id="histPane" hidden>
    <ol id="histList"></ol>
  </div>
</aside>
<div id="toast" class="ui"></div>
<input type="file" id="filePick" accept="image/*" multiple hidden>

<div id="scrim">
  <div class="modal" role="dialog" aria-label="Share">
    <button class="x mclose" id="closeShare" title="Close">×</button>
    <div class="mhead"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="mi"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg><h2 id="shareTitle">Share</h2></div>
    <div class="code" id="codeBox" hidden><span id="inviteCode"></span>
      <button class="copy" id="copyBtn" title="Copy"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg></button>
      <button class="copy ghosty" id="makeInvite" title="Make a new code (the old one stops working)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button></div>
    <div class="or"><span>or join</span></div>
    <div class="field"><input id="joinInput" placeholder="pukinotes1-…"><button id="joinBtn" title="Join">→</button></div>
    <div class="err" id="joinErr"></div>
  </div>
</div>
<div id="setScrim" class="scrim2">
  <div class="modal" role="dialog" aria-label="Settings">
    <button class="x mclose" id="closeSet" title="Close">×</button>
    <div class="mhead"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="mi"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><h2>Settings</h2></div>
    <div class="srow"><span class="face me" id="meFace"></span><input id="nameInput" maxlength="40" placeholder="Your name"><div class="swatches" id="swatches"></div></div>
    <div class="srow"><div id="peerList"></div></div>
    <div class="srow net"><i id="netDot"></i><span id="netText"></span></div>
    <div class="srow upd"><div id="updRow" hidden></div><button id="updLink" title="Check for updates"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span>v<span id="verLabel"></span></span></button></div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
